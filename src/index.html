<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="exam-kara-build" content="__BUILD_VERSION__">
  <title>EXAM KARA</title>
  <meta name="description" content="Kara 的互動測試首頁，集中展示目前可用與準備中的測試頁。">
  <meta property="og:title" content="EXAM KARA">
  <meta property="og:description" content="集中展示目前可用與準備中的互動測試頁。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=__BUILD_VERSION__">
</head>
<body>
  <div class="lang-control">
    <label class="sr-only" for="lang-select">Language</label>
    <select id="lang-select" class="lang-select" aria-label="Language"></select>
  </div>

  <div class="marquee marquee-top" aria-hidden="true">
    <div class="marquee-track" id="marquee-top-track"></div>
  </div>

  <main class="site-main">
    <section class="hero-band">
      <div class="hero-rail hero-rail-left" aria-hidden="true" data-copy="heroRailLeft">試験案内</div>
      <div class="hero-rail hero-rail-right" aria-hidden="true" data-copy="heroRailRight">exam.kara251.com</div>

      <div class="hero-shell">
        <div class="rule-double"></div>
        <div class="hero-header">
          <span class="hero-tag" data-copy="heroTag">号外 EXTRA</span>
          <span class="hero-date" data-copy="heroDate">VOL. 01 ── EXAM INDEX</span>
        </div>
        <div class="stripe"></div>
        <div class="hero-mixed" aria-hidden="true" data-copy="heroMixedLine">✧ EXAM KARA × 測試索引 ✧</div>

        <div class="hero-title">
          <span class="hero-year glitch-text" data-text="2026">2026</span>
          <h1>
            <span>EXAM</span>
            <span>KARA</span>
          </h1>
        </div>

        <div class="rule"></div>

        <div class="hero-copy">
          <span class="hero-copy-tag" data-copy="heroCopyTag">── 測試集合 ──</span>
          <p data-copy="heroCopy">把已完成與進行中的互動測試，集中掛在同一個首頁與同一個網域下。</p>
        </div>

        <div class="hero-actions">
          <a class="btn-primary" href="#tests" data-copy="heroPrimaryAction">查看測試</a>
          <a class="btn-secondary" id="hero-random-action" href="/tests/anime-summer-2026/" data-copy="heroSecondaryAction">進入動漫測試</a>
        </div>

        <div class="hero-meta">
          <span data-copy="heroMetaDomain">DOMAIN: exam.kara251.com</span>
          <span data-copy="heroMetaRoute">ROUTE PATTERN: /tests/&lt;slug&gt;/</span>
        </div>

        <div class="hero-footer">
          <span data-copy="heroFooterPrimary">INTERACTIVE TEST INDEX</span>
          <span class="hero-footer-secondary" data-copy="heroFooterSecondary">互動測試子路由首頁</span>
        </div>
        <div class="rule-double"></div>
        <div class="hero-sparkle" aria-hidden="true" data-copy="heroSparkle">☆ﾟ.*･｡ﾟ</div>
      </div>
    </section>

    <section class="catalog-band" id="tests">
      <div class="catalog-shell">
        <div class="catalog-heading">
          <div>
            <p class="section-kicker" data-copy="sectionKicker">TEST INDEX</p>
            <h2 data-copy="sectionTitle">目前可用與準備中的頁面</h2>
          </div>
          <p class="section-note" data-copy="sectionNote">版面與字體延續動漫測試的編輯感，讓後續新測試直接併進來。</p>
        </div>

        <div class="rule"></div>

        <div class="test-list" id="test-list"></div>
      </div>
    </section>
  </main>

  <div class="marquee marquee-bottom" aria-hidden="true">
    <div class="marquee-track" id="marquee-bottom-track"></div>
  </div>

  <script src="/shared-runtime.js?v=__BUILD_VERSION__" defer></script>
  <script src="/shared-locale.js?v=__BUILD_VERSION__" defer></script>
  <script src="/app.js?v=__BUILD_VERSION__" defer></script>
</body>
</html>
